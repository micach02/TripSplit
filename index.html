<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#00798d" />
    <meta name="apple-mobile-web-app-title" content="TripSplit" />
    <meta name="description" content="Monthly budgets, group trips and shared expenses in one app. Log an expense in seconds, split it fairly, and see who owes whom. Free, no ads." />
    <!-- Link previews in Messenger, Viber, WhatsApp and social apps. %SITE_URL% is filled in at build time (vite.config.ts). -->
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TripSplit" />
    <meta property="og:title" content="TripSplit — budgets, trips and shared expenses" />
    <meta property="og:description" content="Log an expense in seconds, split it fairly, and see who owes whom. Free, no ads, works on any phone." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="TripSplit: budgets, trips and shared expenses" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400..800&display=swap"
      rel="stylesheet"
    />
    <title>TripSplit</title>
    <script>
      // Light or dark before the first paint, so dark mode doesn't flash white. See src/lib/theme.ts.
      try {
        var saved = localStorage.getItem('tripsplit:theme')
        var dark = saved === 'light' || saved === 'dark' ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
